body{background:#ede9ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;font-family:'Syne',sans-serif;}

.badge-name{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#7b6ea8;letter-spacing:.06em;text-transform:uppercase;}
.badge-elo{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(123,110,168,0.6);}
